#
# Check for:
#
# - 1 KeystoneAPI CR
# - Deployment with tls volumes

apiVersion: keystone.openstack.org/v1beta1
kind: KeystoneAPI
metadata:
  name: keystone
spec:
  tls:
    api:
      internal:
        secretName: cert-keystone-internal-svc
      public:
        secretName: cert-keystone-public-svc
    caBundleSecretName: combined-ca-bundle
status:
  readyCount: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone
spec:
  replicas: 1
  template:
    metadata:
      labels:
        service: keystone
    spec:
      containers:
      - args:
        - -c
        - /usr/sbin/httpd -DFOREGROUND
        volumeMounts:
        - mountPath: /etc/keystone/keystone.conf
          name: config-data
          readOnly: true
          subPath: keystone.conf
        - mountPath: /etc/keystone/keystone.conf.d/custom.conf
          name: config-data
          readOnly: true
          subPath: custom.conf
        - mountPath: /etc/httpd/conf/httpd.conf
          name: config-data
          readOnly: true
          subPath: httpd.conf
        - mountPath: /etc/httpd/conf.d/ssl.conf
          name: config-data
          readOnly: true
          subPath: ssl.conf
        - mountPath: /etc/my.cnf
          name: config-data
          readOnly: true
          subPath: my.cnf
        - mountPath: /etc/keystone/fernet-keys
          name: fernet-keys
          readOnly: true
        - mountPath: /etc/keystone/credential-keys
          name: credential-keys
          readOnly: true
        - mountPath: /run/httpd
          name: run-httpd
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/log/keystone
          name: var-log-keystone
        - mountPath: /var/log/httpd
          name: var-log-httpd
        - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          name: combined-ca-bundle
          readOnly: true
          subPath: tls-ca-bundle.pem
        - mountPath: /etc/pki/tls/certs/internal.crt
          name: internal-tls-certs
          readOnly: true
          subPath: tls.crt
        - mountPath: /etc/pki/tls/private/internal.key
          name: internal-tls-certs
          readOnly: true
          subPath: tls.key
        - mountPath: /etc/pki/tls/certs/public.crt
          name: public-tls-certs
          readOnly: true
          subPath: tls.crt
        - mountPath: /etc/pki/tls/private/public.key
          name: public-tls-certs
          readOnly: true
          subPath: tls.key
      volumes:
      - name: config-data
        secret:
          defaultMode: 288
          secretName: keystone-config-data
      - name: fernet-keys
        secret:
          defaultMode: 288
          items:
          - key: FernetKeys0
            path: "0"
          - key: FernetKeys1
            path: "1"
          - key: FernetKeys2
            path: "2"
          - key: FernetKeys3
            path: "3"
          - key: FernetKeys4
            path: "4"
          secretName: keystone
      - name: credential-keys
        secret:
          defaultMode: 288
          items:
          - key: CredentialKeys0
            path: "0"
          - key: CredentialKeys1
            path: "1"
          secretName: keystone
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: run-httpd
      - emptyDir: {}
        name: var-log-keystone
      - emptyDir: {}
        name: var-log-httpd
      - name: combined-ca-bundle
        secret:
          defaultMode: 292
          secretName: combined-ca-bundle
      - name: internal-tls-certs
        secret:
          defaultMode: 256
          secretName: cert-keystone-internal-svc
      - name: public-tls-certs
        secret:
          defaultMode: 256
          secretName: cert-keystone-public-svc
---
# the actual addresses of the apiEndpoints are platform specific, so we can't rely on
# kuttl asserts to check them. This short script gathers the addresses and checks that
# the three endpoints are defined and their addresses follow the default pattern
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |
      # Verify databaseHostname matches the expected namespace-based pattern
      dbHostTemplate='{{.status.databaseHostname}}'
      dbHostname=$(oc get -n $NAMESPACE KeystoneAPI keystone -o go-template="$dbHostTemplate")
      expectedDbHostname="openstack.$NAMESPACE.svc"
      if [ "$dbHostname" != "$expectedDbHostname" ]; then
        echo "databaseHostname mismatch: got '$dbHostname', expected '$expectedDbHostname'"
        exit 1
      fi

      # the actual addresses of the apiEndpoints are platform specific, so we can't rely on
      # kuttl asserts to check them. This short script gathers the addresses and checks that
      # the three endpoints are defined and their addresses follow the default pattern
      template='{{.status.apiEndpoints.internal}}{{":"}}{{.status.apiEndpoints.public}}{{"\n"}}'
      regex="https:\/\/keystone-internal.$NAMESPACE.*:https:\/\/keystone-public.$NAMESPACE.*"
      apiEndpoints=$(oc get -n $NAMESPACE KeystoneAPI  keystone -o go-template="$template")
      matches=$(echo "$apiEndpoints" | sed -e "s?$regex??")
      if [ -z "$matches" ]; then
        exit 0
      else
        echo "Endpoints URLS: $apiEndpoints do not match regex"
        exit 1
      fi
